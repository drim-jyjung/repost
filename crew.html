<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<style>
  :root {
    --ig-purple: #833AB4;
    --ig-pink: #E1306C;
    --ig-orange: #F77737;
    --pastel-bg: #F6EEFA;
    --bg: #FFFFFF;
    --text: #262626;
    --muted: #9CA3AF;
    --danger: #ED4956;
    --success: #2E9E5B;
    --border: #F0F0F0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "맑은 고딕", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  .header {
    padding: 36px 20px 20px; text-align: center;
  }
  .logo-badge {
    width: 56px; height: 56px; border-radius: 18px; margin: 0 auto 14px;
    background: var(--pastel-bg); display: flex; align-items: center; justify-content: center; font-size: 26px;
  }
  .header h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.3px; color: var(--text); }
  .header p { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
  .container { max-width: 400px; margin: 0 auto; padding: 4px 20px 40px; }
  .card {
    background: #fff; border: 1px solid var(--border); border-radius: 22px; padding: 26px 22px; margin-bottom: 16px;
  }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 7px; font-weight: 600; }
  .field input {
    width: 100%; padding: 14px 16px; border: 1.5px solid #ECECEC; border-radius: 14px;
    font-size: 15px; outline: none; transition: border-color .15s; background: #FAFAFA;
  }
  .field input:focus { border-color: var(--ig-pink); background: #fff; }
  .error-text { color: var(--danger); font-size: 12.5px; margin-top: 7px; display: none; }
  .btn {
    width: 100%; padding: 15px; border: none; border-radius: 14px; font-size: 15px; font-weight: 700;
    color: #fff; cursor: pointer; transition: opacity .15s, transform .1s; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .btn-primary { background: linear-gradient(135deg, var(--ig-purple), var(--ig-pink)); }
  .btn-service { background: linear-gradient(135deg, var(--ig-orange), #FCAF45); }
  .btn-complete { background: var(--success); }
  .btn-secondary { background: #F5F5F5; color: var(--text); }

  .spinner {
    width: 16px; height: 16px; border: 2.5px solid rgba(255,255,255,0.4); border-top-color: #fff;
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 12.5px; font-weight: 700; }
  .badge-normal { background: #E9F7EF; color: var(--success); }
  .badge-service { background: #FFF1E6; color: #C2540A; }
  .badge-honor { background: #FCE7F0; color: var(--ig-pink); }
  .badge-admin { background: #EAF1FD; color: #2563EB; }
  .badge-locked { background: #FDECEC; color: var(--danger); }

  .stat-row { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 20px; padding-top: 16px; border-top: 1px solid var(--border); }
  .stat-label { font-size: 13px; color: var(--muted); }
  .stat-value { font-size: 22px; font-weight: 700; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #262626; color: #fff; padding: 13px 22px; border-radius: 14px;
    font-size: 13.5px; max-width: 88%; text-align: center; opacity: 0; transition: opacity .25s, bottom .25s;
    pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; bottom: 32px; }
  .toast.error { background: var(--danger); }
  .toast.success { background: var(--success); }

  .skeleton { background: linear-gradient(90deg, #f2f2f2 25%, #fafafa 50%, #f2f2f2 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 10px; height: 18px; margin-bottom: 8px; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  .hidden { display: none !important; }
  .center-note { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 12px; }

  .account-bar {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-top: 10px; font-size: 12.5px; color: var(--muted);
  }
  .account-bar #logoutBtn {
    background: none; border: 1px solid #ECECEC; color: var(--muted);
    border-radius: 20px; padding: 4px 12px; font-size: 12px; cursor: pointer;
  }
  .account-bar #logoutBtn:hover { background: #FAFAFA; color: var(--text); }
  .error-detail { font-size: 11px; color: var(--muted); margin-top: 6px; word-break: break-all; }

  .account-pills { display: inline-flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .pill { display: inline-block; padding: 3px 9px; border-radius: 12px; font-size: 11px; font-weight: 700; }
  .pill-week { background: #F0F0F0; color: var(--text); }
  .pill-service { background: #FFF1E6; color: #C2540A; }
  .pill-honor { background: #FCE7F0; color: var(--ig-pink); }

  .my-link-box {
    margin-top: 14px; padding: 12px 14px; background: #FAFAFA; border-radius: 12px;
    font-size: 12.5px; color: var(--muted);
  }
  .my-link-box a { color: var(--ig-pink); word-break: break-all; }
</style>
</head>
<body>

<div class="header">
  <div class="logo-badge">🎈</div>
  <h1>리포스트열기구</h1>
  <p id="phaseLabel">확인 중...</p>
  <div id="accountBar" class="account-bar hidden">
    <span id="accountLabel"></span>
    <span id="accountPills" class="account-pills"></span>
    <button id="logoutBtn" onclick="doLogout()">로그아웃</button>
  </div>
</div>

<div class="container">

  <!-- 로그인 화면 -->
  <div class="card" id="loginCard">
    <div class="field">
      <label>닉네임</label>
      <input type="text" id="loginNickname" placeholder="예: 열기구히아" autocomplete="off">
    </div>
    <div class="field">
      <label>인스타 아이디</label>
      <input type="text" id="loginAccountId" placeholder="예: hia_insta" autocomplete="off">
      <div class="error-text" id="loginError"></div>
    </div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">
      <span id="loginBtnText">로그인</span>
    </button>
  </div>

  <!-- 로딩 스켈레톤 -->
  <div class="card hidden" id="loadingCard">
    <div class="skeleton" style="width:60%"></div>
    <div class="skeleton" style="width:40%"></div>
    <div class="skeleton" style="width:80%; height:44px; margin-top:16px;"></div>
  </div>

  <!-- 홈 화면 -->
  <div class="card hidden" id="homeCard">
    <div style="margin-top:0;" id="actionArea"></div>
    <div class="center-note" id="phaseNote"></div>
    <div class="my-link-box hidden" id="myLinkBox"></div>
  </div>

  <!-- 잠금 화면 -->
  <div class="card hidden" id="lockedCard">
    <div class="badge badge-locked">🔒 계정 잠금</div>
    <p style="margin-top:14px; font-size:14px; line-height:1.6;">봉사 미이행으로 계정이 잠겼습니다.<br>운영진에게 문의해주세요.</p>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// GitHub 등 외부 호스팅에서 구글 앱스크립트를 호출하기 위한 배포 URL
const API_URL = 'https://script.google.com/macros/s/AKfycbzXVUjvvw1feZbE0XJhzG_V5IFG0I9vyu2jFBbrALZhQ4kqbSlLE-8sk_Lp-wvmueIU/exec';

// google.script.run 대신 쓰는 fetch 래퍼. text/plain으로 보내면 브라우저가 preflight(OPTIONS)
// 요청을 안 보내서(=simple request) 앱스크립트가 못 받는 문제를 피할 수 있음.
function api(action, params) {
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: action, params: params || {} }),
  }).then(function (r) {
    // 응답이 JSON이 아닌 경우(배포 설정 문제로 구글 로그인/에러 HTML이 오는 경우 등)를
    // 구분해서 진단할 수 있도록 원문을 먼저 텍스트로 받고 직접 파싱한다.
    return r.text().then(function (text) {
      try {
        return JSON.parse(text);
      } catch (e) {
        const err = new Error('서버 응답을 해석하지 못했어요 (JSON 아님).');
        err.rawResponse = text.slice(0, 300);
        err.httpStatus = r.status;
        throw err;
      }
    });
  });
}

let currentMember = null;
let currentState = null;
let pollTimer = null;

// 시간 판정은 전부 서버(getServiceContext_)가 하고 클라이언트는 스스로 계산하지 않는다는
// 원칙에 맞춰, "완료 가능 시간"을 기다리는 동안엔 주기적으로 서버 상태를 다시 물어봐서
// 자동으로 버튼을 활성화한다 (클라이언트 로컬시계로 22:00을 직접 계산하지 않음).
function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}
function startPolling() {
  if (pollTimer) return; // 중복 방지
  pollTimer = setInterval(function () {
    if (currentMember) refreshHome();
  }, 30000); // 30초마다 서버 재조회
}

// ─── 자동로그인 ───
window.onload = function() {
  const saved = localStorage.getItem('repost_member');
  if (saved) {
    const { nickname, accountId } = JSON.parse(saved);
    showLoading();
    api('login', { nickname: nickname, accountId: accountId })
      .then(handleHomeResult)
      .catch(handleServerError);
  }
};

function showLoading() {
  document.getElementById('loginCard').classList.add('hidden');
  document.getElementById('homeCard').classList.add('hidden');
  document.getElementById('lockedCard').classList.add('hidden');
  document.getElementById('loadingCard').classList.remove('hidden');
}

function doLogin() {
  const nickname = document.getElementById('loginNickname').value.trim();
  const accountId = document.getElementById('loginAccountId').value.trim();
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';

  if (!nickname || !accountId) {
    errEl.textContent = '닉네임과 인스타 아이디를 모두 입력해주세요.';
    errEl.style.display = 'block';
    return;
  }

  setBtnLoading('loginBtn', 'loginBtnText', true, '로그인 중');
  api('login', { nickname: nickname, accountId: accountId })
    .then(function(res) {
      setBtnLoading('loginBtn', 'loginBtnText', false, '로그인');
      if (res.ok) {
        localStorage.setItem('repost_member', JSON.stringify({ nickname, accountId }));
      } else {
        errEl.textContent = res.error;
        errEl.style.display = 'block';
      }
      handleHomeResult(res);
    })
    .catch(function(err) {
      setBtnLoading('loginBtn', 'loginBtnText', false, '로그인');
      handleServerError(err);
    });
}

function setBtnLoading(btnId, textId, loading, label) {
  const btn = document.getElementById(btnId);
  const text = document.getElementById(textId);
  btn.disabled = loading;
  text.innerHTML = loading ? '<span class="spinner"></span> ' + label : label;
}

function handleServerError(err) {
  document.getElementById('loadingCard').classList.add('hidden');
  if (!currentMember) document.getElementById('loginCard').classList.remove('hidden');
  // 콘솔에 실제 원인을 남겨서 진단 가능하게 함 (배포 URL 오류, CORS, 응답이 JSON이 아님 등)
  console.error('[repost] server error detail:', err);
  const detail = err && err.rawResponse ? (' (' + (err.message || '') + ')') : (err && err.message ? (' (' + err.message + ')') : '');
  showToast('오류가 발생했어요.' + detail + ' 콘솔(F12)에서 자세한 내용을 확인해주세요.', 'error');
}

function handleHomeResult(res) {
  document.getElementById('loadingCard').classList.add('hidden');

  if (!res.ok) {
    stopPolling();
    localStorage.removeItem('repost_member');
    currentMember = null;
    document.getElementById('accountBar').classList.add('hidden');
    if (res.locked) {
      document.getElementById('lockedCard').classList.remove('hidden');
      document.getElementById('phaseLabel').textContent = '계정 잠김';
    } else {
      document.getElementById('loginCard').classList.remove('hidden');
      document.getElementById('loginError').textContent = res.error;
      document.getElementById('loginError').style.display = 'block';
    }
    return;
  }

  currentMember = res.member;
  currentState = res;

  // 로그인 성공 시 로그인 화면은 반드시 숨기고 홈 화면만 보여야 함 (이전엔 이 처리가 빠져있어 두 화면이 겹쳐 보였음)
  document.getElementById('loginCard').classList.add('hidden');
  document.getElementById('lockedCard').classList.add('hidden');
  document.getElementById('homeCard').classList.remove('hidden');

  document.getElementById('accountLabel').textContent = res.member.nickname + ' (' + res.member.role + ')';
  document.getElementById('accountBar').classList.remove('hidden');

  renderHome(res);
}

function doLogout() {
  stopPolling();
  localStorage.removeItem('repost_member');
  currentMember = null;
  currentState = null;
  document.getElementById('accountBar').classList.add('hidden');
  document.getElementById('homeCard').classList.add('hidden');
  document.getElementById('lockedCard').classList.add('hidden');
  document.getElementById('loadingCard').classList.add('hidden');
  document.getElementById('loginCard').classList.remove('hidden');
  document.getElementById('loginNickname').value = '';
  document.getElementById('loginAccountId').value = '';
  document.getElementById('phaseLabel').textContent = '확인 중...';
}

function renderHome(res) {
  const phaseText = { LINK_OPEN: '참여 가능 시간 (11:00~22:00)', COMPLETE_OPEN: '완료투표 가능 시간', CLOSED: '정산 진행 중 (10:00~11:00)' };
  document.getElementById('phaseLabel').textContent = phaseText[res.phase] || '';

  // 계정정보 옆에 상황에 따라 노출되는 pill들 (이번주 참여횟수는 항상, 봉사/명예는 해당할 때만)
  let pills = '<span class="pill pill-week">이번 주 ' + res.weeklyCount.participated + '회</span>';
  if (currentMember.role === '운영진') pills += '<span class="pill pill-honor">👑 운영진</span>';
  else if (res.flow === 'SERVICE') pills += '<span class="pill pill-service">🛠 봉사대상</span>';
  else if (currentMember.honor) pills += '<span class="pill pill-honor">⭐ 명예</span>';
  document.getElementById('accountPills').innerHTML = pills;

  // 오늘 내가 등록한 링크 노출
  const linkBox = document.getElementById('myLinkBox');
  if (res.myLink) {
    linkBox.classList.remove('hidden');
    linkBox.innerHTML = '오늘 등록한 링크<br><a href="' + res.myLink + '" target="_blank" rel="noopener">' + res.myLink + '</a>';
  } else {
    linkBox.classList.add('hidden');
    linkBox.innerHTML = '';
  }

  renderActionArea(res);
}

function renderActionArea(res) {
  const area = document.getElementById('actionArea');
  const note = document.getElementById('phaseNote');
  area.innerHTML = '';
  note.textContent = '';
  stopPolling(); // 렌더링할 때마다 초기화하고, 필요한 경우에만 아래서 다시 켠다

  if (res.flow === 'SINGLE_COMPLETE') {
    if (res.hasComplete) {
      area.innerHTML = '<div class="badge badge-normal" style="width:100%;text-align:center;padding:14px;box-sizing:border-box;">✅ 오늘 등록 완료</div>';
      return;
    }
    if (res.phase !== 'LINK_OPEN') { note.textContent = '지금은 등록 가능 시간이 아니에요 (11:00~22:00)'; return; }
    area.innerHTML = renderLinkInput('single');
    return;
  }

  if (res.flow === 'LINK_THEN_COMPLETE') {
    if (res.hasComplete) {
      area.innerHTML = '<div class="badge badge-normal" style="width:100%;text-align:center;padding:14px;box-sizing:border-box;">✅ 오늘 완료</div>';
      return;
    }
    if (!res.hasLinkOrService) {
      if (res.phase !== 'LINK_OPEN') { note.textContent = '지금은 링크등록 가능 시간이 아니에요 (11:00~22:00)'; return; }
      area.innerHTML = renderLinkInput('link');
      return;
    }
    if (res.phase !== 'COMPLETE_OPEN') {
      area.innerHTML = renderDisabledComplete('참여완료');
      note.textContent = '링크등록 완료! 22:00부터 완료투표 버튼이 자동으로 활성화돼요.';
      startPolling();
      return;
    }
    area.innerHTML = '<button class="btn btn-complete" id="actionBtn" onclick="doComplete()"><span id="actionBtnText">참여완료</span></button>';
    return;
  }

  if (res.flow === 'SERVICE') {
    if (res.hasComplete) {
      area.innerHTML = '<div class="badge badge-normal" style="width:100%;text-align:center;padding:14px;box-sizing:border-box;">✅ 봉사완료</div>';
      return;
    }
    if (!res.hasLinkOrService) {
      if (res.phase !== 'LINK_OPEN') { note.textContent = '지금은 봉사참여 가능 시간이 아니에요 (11:00~22:00)'; return; }
      area.innerHTML = '<button class="btn btn-service" id="actionBtn" onclick="doService()"><span id="actionBtnText">봉사참여</span></button>';
      return;
    }
    if (res.phase !== 'COMPLETE_OPEN') {
      area.innerHTML = renderDisabledComplete('봉사완료');
      note.textContent = '봉사참여 완료! 22:00부터 봉사완료 버튼이 자동으로 활성화돼요.';
      startPolling();
      return;
    }
    area.innerHTML = '<button class="btn btn-service" id="actionBtn" onclick="doServiceComplete()"><span id="actionBtnText">봉사완료</span></button>';
    return;
  }
}

function renderDisabledComplete(label) {
  return '<button class="btn btn-complete" disabled style="opacity:0.45;cursor:not-allowed;">' + label + '</button>';
}

function renderLinkInput(mode) {
  return '<div class="field"><label>리포스트 링크</label>' +
    '<input type="text" id="linkInput" placeholder="https://www.instagram.com/p/...">' +
    '<div class="error-text" id="linkError"></div></div>' +
    '<button class="btn btn-primary" id="actionBtn" onclick="doLinkSubmit(\'' + mode + '\')"><span id="actionBtnText">등록</span></button>';
}

function doLinkSubmit(mode) {
  const link = document.getElementById('linkInput').value.trim();
  const errEl = document.getElementById('linkError');
  errEl.style.display = 'none';
  if (!link) {
    errEl.textContent = '링크를 입력해주세요.';
    errEl.style.display = 'block';
    return;
  }
  setBtnLoading('actionBtn', 'actionBtnText', true, '등록 중');
  api('submitLink', { memberId: currentMember.memberId, linkUrl: link })
    .then(onActionResult)
    .catch(handleServerError);
}

function doComplete() {
  setBtnLoading('actionBtn', 'actionBtnText', true, '처리 중');
  api('submitComplete', { memberId: currentMember.memberId }).then(onActionResult).catch(handleServerError);
}
function doService() {
  setBtnLoading('actionBtn', 'actionBtnText', true, '처리 중');
  api('submitService', { memberId: currentMember.memberId }).then(onActionResult).catch(handleServerError);
}
function doServiceComplete() {
  setBtnLoading('actionBtn', 'actionBtnText', true, '처리 중');
  api('submitServiceComplete', { memberId: currentMember.memberId }).then(onActionResult).catch(handleServerError);
}

function onActionResult(res) {
  if (!res.ok) {
    showToast(res.error, 'error');
    // 최신 상태로 새로고침 (시간창 등이 바뀌었을 수 있음)
    refreshHome();
    return;
  }
  showToast(res.message, 'success');
  refreshHome();
}

function refreshHome() {
  api('getCrewHome', { memberId: currentMember.memberId })
    .then(function(res) { currentState = res; renderHome(res); })
    .catch(handleServerError);
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  setTimeout(function() { t.className = 'toast ' + (type || ''); }, 2600);
}
</script>
</body>
</html>
